name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint and debug build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: orin-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    # Runs only on main after verify passes and when the signing secret is set.
    needs: verify
    if: github.ref == 'refs/heads/main' && vars.ENABLE_SIGNED_RELEASE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ORIN_KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.ORIN_KEYSTORE_PROPERTIES }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ORIN_KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "$KEYSTORE_PROPERTIES" || { echo "ORIN_KEYSTORE_PROPERTIES is missing"; exit 1; }
          mkdir -p signing
          echo "$KEYSTORE_BASE64" | base64 --decode > signing/orin-release.jks
          printf '%s\n' "$KEYSTORE_PROPERTIES" > keystore.properties

      - name: Build signed release
        run: ./gradlew --no-daemon :app:assembleRelease :app:lintRelease

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: orin-release-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload deobfuscation mapping
        uses: actions/upload-artifact@v4
        with:
          name: orin-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 365
